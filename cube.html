<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>正方体涂色展开 · 染色规律演示</title>
    <style>
        body, html {
            margin: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background-color: #ffffff;
        }
        #container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }
        /* 左侧控制面板 */
        #control-panel {
            width: 300px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            box-shadow: 2px 0 20px rgba(0,0,0,0.08);
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
            overflow-y: auto;
            box-sizing: border-box;
            border-right: 1px solid #e0e0e0;
        }
        #control-panel h2 {
            margin: 0 0 8px 0;
            font-weight: 500;
            color: #1e1e2f;
            letter-spacing: 1px;
            font-size: 1.6rem;
        }
        #control-panel .subtitle {
            color: #5a5a70;
            margin-top: -10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            border-bottom: 1px solid #ddd;
            padding-bottom: 12px;
        }
        .param-card {
            background: #f8f9fc;
            border-radius: 16px;
            padding: 16px 18px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02), 0 2px 4px rgba(0,0,0,0.02);
        }
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .slider-container label {
            font-weight: 500;
            color: #2c3e50;
            display: flex;
            justify-content: space-between;
        }
        .slider-container input {
            width: 100%;
            cursor: pointer;
            accent-color: #3a7bd5;
        }
        .slider-container span {
            font-weight: 700;
            color: #1e3c72;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 6px 0;
        }
        .toggle-btn {
            flex: 1 0 calc(50% - 10px);
            padding: 12px 0;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            background: #edf2f7;
            color: #2d3748;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            letter-spacing: 0.5px;
        }
        .toggle-btn:hover {
            background: #e2e8f0;
        }
        .toggle-btn.active {
            color: white;
            box-shadow: 0 8px 14px -6px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
        }
        /* 各涂色类型激活颜色 */
        .toggle-btn[data-type="zero"].active { background: #6c7a89; }      /* 零面：灰蓝 */
        .toggle-btn[data-type="one"].active { background: #2ecc71; }       /* 一面：翠绿 */
        .toggle-btn[data-type="two"].active { background: #f39c12; }       /* 两面：橙 */
        .toggle-btn[data-type="three"].active { background: #e74c3c; }     /* 三面：红 */
        
        .reset-btn {
            background: #ffffff;
            border: 1px solid #cbd5e0;
            color: #4a5568;
            padding: 10px 16px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 6px;
        }
        .reset-btn:hover {
            background: #f1f5f9;
            border-color: #a0aec0;
        }
        .stats-box {
            background: #ffffff;
            border-radius: 20px;
            padding: 18px 16px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.02);
            border: 1px solid #f0f2f5;
        }
        .stats-box h3 {
            margin: 0 0 14px 0;
            font-weight: 500;
            color: #1a202c;
            font-size: 1.2rem;
        }
        .stat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #e2e8f0;
        }
        .stat-item:last-child { border-bottom: none; }
        .stat-color {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 4px;
            margin-right: 10px;
        }
        .stat-label {
            display: flex;
            align-items: center;
        }
        .stat-value {
            font-weight: 700;
            font-size: 1.2rem;
            color: #1e293b;
        }
        .note {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 8px;
            line-height: 1.5;
        }
        #viewer {
            flex: 1;
            position: relative;
            background: white;
            outline: none;
        }
        #canvas-wrapper {
            width: 100%;
            height: 100%;
        }
        /* 右下角水印/说明 (可忽略) */
        .info-tip {
            position: absolute;
            bottom: 16px;
            right: 24px;
            color: #94a3b8;
            font-size: 0.8rem;
            background: rgba(255,255,255,0.7);
            padding: 6px 14px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            z-index: 20;
            border: 1px solid rgba(0,0,0,0.03);
        }
    </style>
</head>
<body>
<div id="container">
    <div id="control-panel">
        <h2>🎨 染色·展开</h2>
        <div class="subtitle">正方体涂色分类 · 环境光照</div>
        
        <div class="param-card">
            <div class="slider-container">
                <label>🔲 正方体棱长 <span id="n-value">n = 5</span></label>
                <input type="range" id="n-slider" min="2" max="12" value="5" step="1">
                <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: #6b7280;">
                    <span>2</span><span>12 (可达10+)</span>
                </div>
            </div>
            <div style="margin-top: 12px;">
                <button id="reset-view-btn" class="reset-btn" style="width:100%;">🔄 重置视角 & 归位</button>
            </div>
        </div>

        <div>
            <div style="font-weight: 500; margin-bottom: 8px; color:#334155;">🎛️ 涂色类型 (可多选)</div>
            <div class="button-group">
                <button class="toggle-btn" data-type="zero" id="btn-zero">◻️ 零面涂色</button>
                <button class="toggle-btn" data-type="one" id="btn-one">🟩 一面涂色</button>
                <button class="toggle-btn" data-type="two" id="btn-two">🟧 两面涂色</button>
                <button class="toggle-btn" data-type="three" id="btn-three">🟥 三面涂色</button>
            </div>
            <p style="font-size:0.8rem; margin: 10px 0 0 6px; color:#5f6b7a;">✨ 点击激活，沿中心连线向外展开<br>涂色面数越多，展开距离越远</p>
        </div>

        <!-- 规律统计卡片 -->
        <div class="stats-box">
            <h3>📊 涂色规律 (当前 n)</h3>
            <div class="stat-item">
                <span class="stat-label"><span class="stat-color" style="background:#6c7a89;"></span>零面涂色</span>
                <span class="stat-value" id="stat-zero">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label"><span class="stat-color" style="background:#2ecc71;"></span>一面涂色</span>
                <span class="stat-value" id="stat-one">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label"><span class="stat-color" style="background:#f39c12;"></span>两面涂色</span>
                <span class="stat-value" id="stat-two">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label"><span class="stat-color" style="background:#e74c3c;"></span>三面涂色</span>
                <span class="stat-value" id="stat-three">0</span>
            </div>
            <div class="note">
                ⚡ 三面: 8个顶点 · 两面: 12(n-2) · 一面: 6(n-2)² · 零面: (n-2)³
            </div>
        </div>
        <div style="margin-top: auto; font-size: 0.8rem; color: #8b9ab0; text-align: center; padding-top: 10px;">
            棱边黑线 · 仅环境光<br>拖动视角观察展开
        </div>
    </div>
    <div id="viewer">
        <div id="canvas-wrapper"></div>
        <div class="info-tip">🖱️ 鼠标拖动旋转 / 滚轮缩放</div>
    </div>
</div>

<!-- 使用 Three.js 和相关库 -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // --- 初始化场景 (仅环境光照) ---
    const container = document.getElementById('canvas-wrapper');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff); // 白色背景
    
    // 仅使用环境光 (AmbientLight)，无点光源/方向光
    const ambientLight1 = new THREE.AmbientLight(0xffffff, 0.65);
    const ambientLight2 = new THREE.AmbientLight(0xccddff, 0.35); // 微冷补充
    scene.add(ambientLight1);
    scene.add(ambientLight2);
    
    // 相机 (透视)
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(12, 8, 18);
    camera.lookAt(0, 0, 0);
    
    // 渲染器
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = false; // 无需阴影
    container.appendChild(renderer.domElement);
    
    // CSS2渲染器用于可选标签 (这里不用，但保留导入)
    const cssRenderer = new CSS2DRenderer();
    cssRenderer.setSize(container.clientWidth, container.clientHeight);
    cssRenderer.domElement.style.position = 'absolute';
    cssRenderer.domElement.style.top = '0';
    cssRenderer.domElement.style.left = '0';
    cssRenderer.domElement.style.pointerEvents = 'none';  // 让点击穿透到canvas
    container.appendChild(cssRenderer.domElement);
    
    // 轨道控制器
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = false;
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.target.set(0, 0, 0);
    controls.update();
    
    // --- 辅助: 添加淡淡的坐标轴参考 (可选，为了视觉定位，不加网格以免杂乱) ---
    // 不加网格，保持清爽。
    
    // --- 全局变量 ---
    let cubesGroup = new THREE.Group();        // 存放所有小立方体
    scene.add(cubesGroup);
    
    let cubeItems = [];            // 每个元素: { group, originalPos, type, mesh, line }
    let currentN = 5;              // 默认棱长
    
    // 展开状态 (多选)
    const activeTypes = {
        zero: false,
        one: false,
        two: false,
        three: false
    };
    
    // 展开距离配置: 涂色面数越多距离越远 (零面最近, 三面最远)
    const expandDistances = {
        zero: 2.6,    // 零面
        one: 4.0,     // 一面
        two: 5.6,     // 两面
        three: 7.2    // 三面
    };
    
    // 颜色配置 (与环境光配合，使用明亮色调)
    const typeColors = {
        zero: 0x6c7a89,    // 灰蓝
        one: 0x2ecc71,     // 翠绿
        two: 0xf39c12,     // 橙
        three: 0xe74c3c    // 红
    };
    
    // --- UI元素 ---
    const nSlider = document.getElementById('n-slider');
    const nSpan = document.getElementById('n-value');
    const btnZero = document.getElementById('btn-zero');
    const btnOne = document.getElementById('btn-one');
    const btnTwo = document.getElementById('btn-two');
    const btnThree = document.getElementById('btn-three');
    const resetViewBtn = document.getElementById('reset-view-btn');
    
    const statZero = document.getElementById('stat-zero');
    const statOne = document.getElementById('stat-one');
    const statTwo = document.getElementById('stat-two');
    const statThree = document.getElementById('stat-three');
    
    // 按钮激活样式切换
    function updateButtonUI() {
        btnZero.classList.toggle('active', activeTypes.zero);
        btnOne.classList.toggle('active', activeTypes.one);
        btnTwo.classList.toggle('active', activeTypes.two);
        btnThree.classList.toggle('active', activeTypes.three);
    }
    
    // --- 根据坐标判断涂色类型 (0-indexed, 0..n-1) ---
    function getCubeType(i, j, k, n) {
        const onFace = (i === 0 || i === n-1) ? 1 : 0;
        const onFaceJ = (j === 0 || j === n-1) ? 1 : 0;
        const onFaceK = (k === 0 || k === n-1) ? 1 : 0;
        const sum = onFace + onFaceJ + onFaceK;
        
        if (sum === 0) return 'zero';
        if (sum === 1) return 'one';
        if (sum === 2) return 'two';
        return 'three'; // sum === 3
    }
    
    // --- 计算统计规律并更新UI ---
    function updateStats(n) {
        const nMinus2 = Math.max(0, n - 2);
        const threeCount = (n >= 2) ? 8 : 0;
        const twoCount = (n >= 3) ? 12 * nMinus2 : 0;
        const oneCount = (n >= 3) ? 6 * nMinus2 * nMinus2 : 0;
        const zeroCount = (n >= 3) ? nMinus2 * nMinus2 * nMinus2 : 0;
        
        statZero.textContent = zeroCount;
        statOne.textContent = oneCount;
        statTwo.textContent = twoCount;
        statThree.textContent = threeCount;
    }
    
    // --- 生成大正方体 (清除旧数据) ---
    function generateCube(n) {
        // 清除旧group
        while(cubesGroup.children.length) {
            cubesGroup.remove(cubesGroup.children[0]);
        }
        cubeItems = [];
        
        const center = new THREE.Vector3((n-1)/2, (n-1)/2, (n-1)/2);
        
        // 为了性能，小立方体边长设为1，几何体复用
        const boxGeo = new THREE.BoxGeometry(0.98, 0.98, 0.98); // 微小间隙让棱线更明显
        
        for (let i = 0; i < n; i++) {
            for (let j = 0; j < n; j++) {
                for (let k = 0; k < n; k++) {
                    const type = getCubeType(i, j, k, n);
                    const colorHex = typeColors[type];
                    
                    // 材质 (受环境光影响，使用标准材质)
                    const material = new THREE.MeshStandardMaterial({
                        color: colorHex,
                        roughness: 0.45,
                        metalness: 0.05,
                        emissive: new THREE.Color(0x222222),
                        transparent: true,
                        opacity: 0.92
                    });
                    
                    const mesh = new THREE.Mesh(boxGeo, material);
                    
                    // 黑色棱边 (EdgesGeometry)
                    const edges = new THREE.EdgesGeometry(boxGeo);
                    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));
                    
                    // 将mesh和line放入同一个Group
                    const group = new THREE.Group();
                    mesh.position.set(0, 0, 0);
                    line.position.set(0, 0, 0);
                    group.add(mesh);
                    group.add(line);
                    
                    // 原始位置 (基于索引，中心对齐)
                    const originalPos = new THREE.Vector3(i, j, k);
                    group.position.copy(originalPos);
                    
                    cubesGroup.add(group);
                    
                    cubeItems.push({
                        group,
                        originalPos: originalPos.clone(),
                        type,
                        mesh,
                        line
                    });
                }
            }
        }
        
        // 将整体居中: 使大正方体中心位于原点
        cubesGroup.position.set(-center.x, -center.y, -center.z);
        
        // 更新统计
        updateStats(n);
    }
    
    // --- 根据当前激活状态计算每个cube的目标位置 ---
    function computeTargetPositions() {
        const center = new THREE.Vector3((currentN-1)/2, (currentN-1)/2, (currentN-1)/2);
        
        cubeItems.forEach(item => {
            const type = item.type;
            const shouldExpand = activeTypes[type];
            
            if (!shouldExpand) {
                item.targetPos = item.originalPos.clone();
                return;
            }
            
            // 方向: 从小立方体中心指向大立方体中心的反方向? 要求“沿着小正方体中心和原本大正方体中心的连线外侧展开”
            // 即从小中心指向大中心的方向，再向外 (所以是从大中心指向小中心的方向向外)
            const dir = new THREE.Vector3().subVectors(item.originalPos, center);
            const len = dir.length();
            let direction;
            if (len < 0.001) {
                // 中心点特殊处理 (n为奇数时正中心立方体)
                direction = new THREE.Vector3(1, 0, 0);
            } else {
                direction = dir.clone().normalize();
            }
            
            const dist = expandDistances[type];
            const target = item.originalPos.clone().add(direction.multiplyScalar(dist));
            item.targetPos = target;
        });
    }
    
    // --- 动画循环: 插值移动 ---
    function animate() {
        requestAnimationFrame(animate);
        
        // 平滑移动 (lerp)
        const lerpFactor = 0.18;
        cubeItems.forEach(item => {
            if (item.targetPos) {
                item.group.position.lerp(item.targetPos, lerpFactor);
            }
        });
        
        controls.update();
        
        renderer.render(scene, camera);
        cssRenderer.render(scene, camera);
    }
    
    // --- 重置所有展开状态，归位 ---
    function resetAllExpansion() {
        activeTypes.zero = false;
        activeTypes.one = false;
        activeTypes.two = false;
        activeTypes.three = false;
        updateButtonUI();
        computeTargetPositions();
    }
    
    // --- 处理n变化 ---
    function onNChange(val) {
        currentN = val;
        nSpan.textContent = `n = ${currentN}`;
        
        // 重置所有激活状态 (新正方体默认全部归位)
        activeTypes.zero = false;
        activeTypes.one = false;
        activeTypes.two = false;
        activeTypes.three = false;
        updateButtonUI();
        
        generateCube(currentN);
        computeTargetPositions(); // 目标位置=原始位置
        
        // 稍微调整相机远一点如果n很大
        const dist = Math.max(12, currentN * 1.5);
        camera.position.set(dist * 0.9, dist * 0.7, dist * 1.1);
        controls.target.set(0, 0, 0);
        controls.update();
    }
    
    // --- 初始化 & 事件绑定 ---
    function init() {
        // 初始生成 n=5
        currentN = parseInt(nSlider.value, 10);
        nSpan.textContent = `n = ${currentN}`;
        generateCube(currentN);
        computeTargetPositions();
        
        // 滑块监听
        nSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value, 10);
            onNChange(val);
        });
        
        // 按钮监听
        btnZero.addEventListener('click', () => {
            activeTypes.zero = !activeTypes.zero;
            updateButtonUI();
            computeTargetPositions();
        });
        btnOne.addEventListener('click', () => {
            activeTypes.one = !activeTypes.one;
            updateButtonUI();
            computeTargetPositions();
        });
        btnTwo.addEventListener('click', () => {
            activeTypes.two = !activeTypes.two;
            updateButtonUI();
            computeTargetPositions();
        });
        btnThree.addEventListener('click', () => {
            activeTypes.three = !activeTypes.three;
            updateButtonUI();
            computeTargetPositions();
        });
        
        // 重置视角 & 归位
        resetViewBtn.addEventListener('click', () => {
            resetAllExpansion();
            // 重置相机位置
            const dist = Math.max(12, currentN * 1.5);
            camera.position.set(dist * 0.9, dist * 0.7, dist * 1.1);
            controls.target.set(0, 0, 0);
            controls.update();
        });
        
        // 窗口大小自适应
        window.addEventListener('resize', onWindowResize, false);
        
        // 开始动画
        animate();
    }
    
    function onWindowResize() {
        const width = container.clientWidth;
        const height = container.clientHeight;
        renderer.setSize(width, height);
        cssRenderer.setSize(width, height);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
    }
    
    // 启动一切
    init();
    
    // 说明：初始无按键，显示完整正方体。
    
    // 添加一点点淡淡的辅助轴线 (可选，不加网格保持干净)
    // 为了视觉参考，加一个非常淡的包围盒线框? 不加了，避免干扰。
    
    console.log('✅ 正方体染色演示已启动 - 仅环境光照，棱边黑线');
</script>
</body>
</html>
